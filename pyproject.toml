[project]
name = "opentalk"
version = "0.1.0"
description = "A streaming voice demo with reliable meeting-room operations"
requires-python = ">=3.11,<3.12"
dependencies = [
    "av>=16,<19",
    "livekit-agents[openai,soniox]>=1.3,<2",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
markers = ["live_llm: opt-in paid integration tests against the configured LLM API"]
