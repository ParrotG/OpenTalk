[documents]
storage_root = "data/documents"
max_file_size_mb = 500
max_pages = 1000
document_timeout_seconds = 7200.0
images_scale = 2.0
table_mode = "accurate"
do_ocr = true
do_picture_description = true
do_picture_classification = true
do_formula_enrichment = true
do_code_enrichment = true
do_chart_extraction = false

[documents.acceleration]
device = "cuda"
num_threads = 8
parser_threads = 8
ocr_batch_size = 8
layout_batch_size = 8
table_batch_size = 4
picture_description_batch_size = 8
queue_max_size = 64
batch_polling_interval_seconds = 0.1
cuda_use_flash_attention2 = false

[documents.heading_hierarchy]
enabled = true
use_bookmarks = true
use_numbering = true
use_style = true
use_font_style = true
style_size_tolerance = 0.05
max_level = 6
bookmark_match_threshold = 0.8

[indexing]
profile = "hierarchical-v3"
chunk_max_chars = 1200
chunk_overlap_chars = 160
parent_max_chars = 4800

[access]
max_outline_items = 40
max_page_span = 3
default_content_chars = 8000
max_content_chars = 16000
default_results = 8
max_results = 20
per_section_limit = 2
max_images = 3
max_image_bytes = 5000000
fuzzy_score_cutoff = 75.0
