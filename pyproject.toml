[project]
name = "opentalk"
version = "0.1.0"
description = "A streaming voice assistant with durable conversation sessions"
requires-python = ">=3.11,<3.12"
dependencies = [
    "av>=16,<19",
    "livekit-agents[openai,soniox,silero]>=1.3,<2",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
markers = ["live_llm: opt-in paid integration tests against the configured LLM API"]

[tool.ruff]
target-version = "py311"
src = ["backend"]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Fixture workers add the test doubles to the module search path before importing them.
"tests/docker_worker.py" = ["E402"]
"frontend/tests/fixtures/*.py" = ["E402"]
